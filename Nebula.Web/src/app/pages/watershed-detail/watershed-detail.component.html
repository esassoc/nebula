<div class="breadcrumb-container">
  <div class="container">
    @if (watershed()) {
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item" aria-current="page">
            <a routerLink="/watersheds">Watersheds</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            {{ watershed().WatershedName }}
          </li>
        </ol>
      </nav>
    }
  </div>
</div>
@if (watershed()) {
  <div class="container mt-sm-4">
    <h2 class="d-inline-block">
      {{ watershed().WatershedName }}
    </h2>
    <app-alert-display></app-alert-display>
    <div class="row mt-4">
      <div class="col-sm-12 col-md-6">
        <div class="card">
          <div class="card-header">Basics</div>
          <div class="card-body">
            <dl class="row">
              <dt class="text-sm-right col-sm-6 col-xs-12">
                <field-definition
                  [fieldDefinitionType]="'Name'"
                ></field-definition>
              </dt>
              <dd class="col-sm-6 col-xs-12">
                {{ watershed().WatershedName }}
              </dd>
            </dl>
          </div>
        </div>
      </div>
      <div class="col-sm-12 col-md-6">
        <div class="card">
          <div class="card-header">Location</div>
          <div class="card-body">
            <div class="row">
              @if (watershed()) {
                <div class="col-sm-12">
                  <watershed-map
                    mapID="watershedsMapForWatershed"
                                [selectedWatershedIDs]="
                                    getSelectedWatershedIDs()
                                "
                    [disableDefaultClick]="true"
                    mapHeight="500px"
                    >
                  </watershed-map>
                </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
