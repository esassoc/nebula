<div class="breadcrumb-container">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb"></ol>
    </nav>
  </div>
</div>

@if (isLoading()) {
  <div class="text-center">
    <span class="fa fa-spinner loading-spinner"></span>
  </div>
}

@if (!isLoading()) {
  <div class="container mt-sm-4 mb-5">
    <app-alert-display></app-alert-display>
    <div>
      <h2 class="d-inline-block">{{ customPageDisplayName() }}</h2>
    </div>
    @if (!isEditing()) {
      @if (showEditButton()) {
        <div
          class="customPageContent"
          style="position: relative; min-height: 60px"
          >
          <div class="hoverEditButton">
            <div style="margin-top: 10px">
              <button
                type="button"
                class="btn btn-nebula"
                (click)="enterEdit()"
                >
                Edit
              </button>
            </div>
          </div>
          @if (!emptyContent) {
            <div [innerHtml]="customPageContent()"></div>
          }
          @if (emptyContent) {
            <div class="hoverEmptySpace"></div>
          }
        </div>
      }
      @if (!showEditButton()) {
        <div [innerHtml]="customPageContent()"></div>
      }
    }
    @if (isEditing()) {
      <div>
        <editor
          #tinyMceEditor
          licenseKey="gpl"
          [init]="tinyMceConfig"
          [(ngModel)]="editedContent"
          >
        </editor>
        <div style="float: right">
          <button
            type="button"
            class="btn btn-primary mt-1 me-1"
            (click)="saveEdit()"
            >
            Save
          </button>
          <button
            type="button"
            class="btn btn-secondary mt-1"
            (click)="cancelEdit()"
            >
            Cancel
          </button>
        </div>
      </div>
    }
  </div>
}
