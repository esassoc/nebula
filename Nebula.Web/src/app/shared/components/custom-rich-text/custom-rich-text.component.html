@if (isLoading()) {
  <div class="text-center">
    <span class="fa fa-spinner loading-spinner"></span>
  </div>
}

@if (!isLoading()) {
  <div>
    @if (!isEditing()) {
      @if (canEdit()) {
        <div
          class="customRichTextContent"
          style="position: relative; min-height: 60px"
          >
          <div class="hoverEditButton">
            <div style="margin-top: 10px">
              <button
                type="button"
                class="btn btn-nebula"
                (click)="enterEdit()"
                >
                Edit
              </button>
            </div>
          </div>
          @if (!emptyContent()) {
            <div
              [innerHtml]="customRichTextContent()"
            ></div>
          }
          @if (emptyContent()) {
            <div class="hoverEmptySpace"></div>
          }
        </div>
      }
      @if (!canEdit()) {
        <div [innerHtml]="customRichTextContent()"></div>
      }
    }
    @if (isEditing()) {
      <div>
        <editor
          #tinyMceEditor
          licenseKey="gpl"
          [init]="tinyMceEditor | tinyMceConfig"
          [(ngModel)]="editedContent"
          >
        </editor>
        <button
          type="button"
          class="btn btn-primary mt-1 me-1"
          (click)="saveEdit()"
          >
          Save
        </button>
        <button
          type="button"
          class="btn btn-secondary mt-1"
          (click)="cancelEdit()"
          >
          Cancel
        </button>
      </div>
    }
  </div>
}
