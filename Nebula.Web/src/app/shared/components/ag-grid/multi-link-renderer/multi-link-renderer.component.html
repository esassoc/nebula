@for (link of params.value.links; track link; let isLast = $last) {
  @if (link.LinkDisplay && !isLast) {
    <a
      [routerLink]="[params.inRouterLink, link.LinkValue]"
      [className]="link.CssClasses"
      >{{ link.LinkDisplay }},
    </a>
  }
  @if (link.LinkDisplay && isLast) {
    <a
      [routerLink]="[params.inRouterLink, link.LinkValue]"
      [className]="link.CssClasses"
      >{{ link.LinkDisplay }}</a
      >
    }
  }
