@if (alerts.length > 0) {
  <div class="mt-2">
    @for (alert of alerts; track alert) {
      <ngb-alert
        [type]="alert.context"
        [dismissible]="alert.dismissable"
        (closed)="closeAlert(alert)"
        >
        <span [innerHTML]="alert.message"></span>
      </ngb-alert>
    }
  </div>
}
