
trigger: none

variables:
  team: 'h2o'
  projectNumber: 'D020211956.00'

  azureApplicationTFStateResourceGroup: 'esa-$(Environment)'
  TfStateStorageAccountName: 'esatfstate$(Environment)'
  TfStateStorageAccountContainerName: 'nebula'
  spokeKeyVaultName: 'aks-spoke-kv-esa-$(Environment)'

  resourceGroupName: 'nebula-$(Environment)'
  keyVaultName: 'nebula-keyvault-$(Environment)'
  storageAccountName: 'nebulaapp$(Environment)'

  databaseName: 'NebulaDB'
  databaseEdition: 'Standard'
  databaseTier: 'ElasticPool'
  sqlGeoserverUsername: 'NebulaGeo'

  # domainApi: 'api-nebula.esa-$(Environment).sitkatech.com' # this is now in a pipeline variable
  # domainWeb: 'nebula.esa-$(Environment).sitkatech.com' # this is now in a pipeline variable
  # domainGeoserver: 'geoserver-nebula.esa-$(Environment).sitkatech.com' # this is now in a pipeline variable


resources:
  repositories:
  - repository: self
    type: git
    ref: develop
  - repository: BuildTemplates
    type: github
    name: esassoc/BuildTemplates
    endpoint: "esassoc"

    
stages:
- stage: BuildDB
  displayName: Build DB
  jobs:

  - template: azure-pipelines/templates/database/dacpac-template.yml@BuildTemplates 
    parameters:
      name: 'Database'
      solutionFile: 'Nebula.Database/Nebula.Database.sqlproj'
      additionalArgs: '/p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider'
      publishPath: 'Nebula.Database/bin/Debug/Nebula.Database.dacpac'
      artifactName: 'Database'




- stage: Test
  displayName: Test All
  condition: and(succeeded(), eq(variables['runTests'], 'true'))
  jobs:  
  - job: Tests
    displayName: 'Tests'
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'dotnet restore'
      inputs:
        command: restore
        projects: 'Nebula.Tests/Nebula.Tests.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet test'
      inputs:
        command: test
        projects: 'Nebula.Tests/Nebula.Tests.csproj'
        arguments: '--no-restore /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=$(Build.SourcesDirectory)/TestResults/Coverage/'
        
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish code coverage report'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Build.SourcesDirectory)/**/coverage.cobertura.xml'


- stage: BuildWeb
  displayName: Build API/Web
  dependsOn: Test
  condition: in(dependencies.Test.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')
  jobs:
  - job: BuildAPI
    displayName: Build API
    condition: eq(variables['build'], 'true')
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0
    
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: "$(azureSubscription)"
        KeyVaultName: '$(spokeKeyVaultName)'
        SecretsFilter: '*'
        RunAsPreJob: true

    - template: azure-pipelines/templates/docker/docker-template.yml@BuildTemplates 
      parameters:
        projectName: 'nebula'
        displayName: 'API'
        subscription: '$(azureSubscription)'
        containerRegistry: '$(kv-containerRegistry)'
        dockerComposeFile: 'docker-compose/docker-compose.yml'
        dockerComposeFileArgs: 'env=$(environment)'
        additionalImageTags: |
          $(Build.BuildNumber)-$(environment)
        includeLatestTag: true
    


  - job: BuildWeb
    displayName: Build Web
    condition: eq(variables['build'], 'true')
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: "$(azureSubscription)"
        KeyVaultName: '$(spokeKeyVaultName)'
        SecretsFilter: '*'
        RunAsPreJob: true

    - template: azure-pipelines/templates/docker/docker-template.yml@BuildTemplates 
      parameters:
        projectName: 'nebula'
        displayName: 'Web'
        subscription: '$(azureSubscription)'
        containerRegistry: '$(kv-containerRegistry)'
        dockerComposeFile: 'Nebula.Web/docker-compose/docker-compose.yml'
        dockerComposeFileArgs: 'env=$(environment)'
        additionalImageTags: |
          $(Build.BuildNumber)-$(environment)
        includeLatestTag: true
    

- stage: BuildTerraform
  displayName: Terraform Plan
  dependsOn: Test
  condition: in(dependencies.Test.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')  
  jobs:
  - job: Terraform
    displayName: Terraform Plan
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: "$(azureSubscription)"
        KeyVaultName: '$(spokeKeyVaultName)'
        SecretsFilter: '*'
        RunAsPreJob: true
    
    - template: azure-pipelines/templates/terraform/terraform.yml@BuildTemplates 
      parameters: 
        ServiceConnectionName: "$(azureSubscription)"
        TfStateStorageAccountName: "$(tfStateStorageAccountName)"
        TfStateStorageAccountContainerName: "$(TfStateStorageAccountContainerName)"
        TfStateStorageAccountResourceGroup: "$(azureApplicationTfStateResourceGroup)"
        WorkingDirectory: './'
        TerraformCommand: plan
        # Folded scalar (>-) joins these lines with spaces. The previous literal
        # block (|) only worked because every line carried an invisible trailing
        # space -- the TerraformCLI task strips newlines WITHOUT adding one, so a
        # newly added line without that trailing space would silently glue itself
        # to its neighbour. Same trap wave-runup hit.
        TerraformCommandOptions: >-
          -var "keyVaultName=$(keyVaultName)"
          -var "storageAccountName=$(storageAccountName)"
          -var "resourceGroupName=$(resourceGroupName)"
          -var "dbServerName=$(kv-dbServerName)"
          -var "aspNetEnvironment=$(aspNetEnvironment)"
          -var "datadogApiKey=$(kv-datadogApiKey)"
          -var "datadogAppKey=$(kv-datadogAppKey)"
          -var "domainApi=$(domainApi)"
          -var "domainWeb=$(domainWeb)"
          -var "environment=$(Environment)"
          -var "domainGeoserver=$(domainGeoserver)"
          -var "databaseName=$(databaseName)"
          -var "databaseEdition=$(databaseEdition)"
          -var "databaseTier=$(databaseTier)"
          -var "sqlPassword=$(kv-sqlAdministratorPassword)"
          -var "sqlUsername=$(kv-sqlAdministratorUsername)"
          -var "azureClusterResourceGroup=$(kv-azureClusterResourceGroup)"
          -var "databaseResourceGroup=$(kv-databaseResourceGroup)"
          -var "sqlGeoserverUsername=$(sqlGeoserverUsername)"
          -var "team=$(team)"
          -var "projectNumber=$(projectNumber)"
          -var "elasticPoolName=$(kv-elasticPoolName)"
          -var "clusterOidcIssuerUrl=$(kv-clusterOidcIssuerUrl)"
          -var "aksNamespace=$(team)"
          -var "sendGridApiKey=$(kv-sendGridApiKey)"

    - task: CopyFiles@2
      inputs:
        sourceFolder: 'charts/nebula'
        contents: '**'
        targetFolder: $(Build.ArtifactStagingDirectory)/chart
      condition: and(succeeded(), eq(variables['deploy'], 'true'))

    - task: PublishBuildArtifacts@1
      inputs:
        artifactName: ChartArtifacts
        pathtoPublish: $(Build.ArtifactStagingDirectory)
      condition: and(succeeded(), eq(variables['deploy'], 'true'))

    - task: PublishBuildArtifacts@1
      inputs:
        artifactName: GeoServerArtifacts
        pathtoPublish: 'Nebula.GeoServer/data_dir'
      condition: and(succeeded(), eq(variables['deploy'], 'true'))


- stage: DeployTerraform
  displayName: Deploy Terraform (with Approval)
  dependsOn: 
    - BuildWeb
    - BuildDB
    - BuildTerraform
  condition: |
    and
    (
      in(dependencies.BuildWeb.result, 'Succeeded', 'SucceededWithIssues'),
      in(dependencies.BuildDB.result, 'Succeeded', 'SucceededWithIssues'),
      in(dependencies.BuildTerraform.result, 'Succeeded', 'SucceededWithIssues'),
      eq(variables['deploy'], 'true')
    )
  jobs:  
  - deployment: Terraform
    pool:
      vmImage: 'windows-latest'
    # creates an environment if it doesn't exist
    environment: '$(Environment)-Approve' # this Environment has an Approval Gate attached to it in the Azure DevOps UI
    strategy:
      # default deployment strategy, more coming...
      runOnce:
        deploy:
          steps:
          - checkout: self
            fetchDepth: 0


          - template: azure-pipelines/templates/terraform/terraform.yml@BuildTemplates 
            parameters: 
              ServiceConnectionName: "$(azureSubscription)"
              TfStateStorageAccountName: "$(tfStateStorageAccountName)"
              TfStateStorageAccountContainerName: "$(TfStateStorageAccountContainerName)"
              TfStateStorageAccountResourceGroup: "$(azureApplicationTfStateResourceGroup)"
              WorkingDirectory: './'
              TerraformCommand: apply
          
          - bash: |
              echo "##vso[task.setvariable variable=STORAGE_ACCOUNT_SAS_KEY;isOutput=true;issecret=true]$(TF_OUT_STORAGE_ACCOUNT_SAS_KEY)"
              echo "##vso[task.setvariable variable=APPLICATION_STORAGE_ACCOUNT_KEY;isOutput=true;issecret=true]$(TF_OUT_APPLICATION_STORAGE_ACCOUNT_KEY)"
              echo "##vso[task.setvariable variable=INSTRUMENTATION_KEY;isOutput=true]$(TF_OUT_INSTRUMENTATION_KEY)"
              echo "##vso[task.setvariable variable=SQL_GEOSERVER_PASSWORD;isOutput=true;issecret=true]$(TF_OUT_SQL_GEOSERVER_PASSWORD)"
              echo "##vso[task.setvariable variable=GEOSERVER_ADMIN_PASSWORD;isOutput=true;issecret=true]$(TF_OUT_GEOSERVER_ADMIN_PASSWORD)"
              echo "##vso[task.setvariable variable=DATABASE_ID;isOutput=true;issecret=true]$(TF_OUT_DATABASE_ID)"
              echo "##vso[task.setvariable variable=WORKLOAD_IDENTITY_CLIENT_ID;isOutput=true]$(TF_OUT_WORKLOAD_IDENTITY_CLIENT_ID)"
              echo "##vso[task.setvariable variable=WORKLOAD_IDENTITY_TENANT_ID;isOutput=true]$(TF_OUT_WORKLOAD_IDENTITY_TENANT_ID)"
          - bash: 'env | sort'

- stage: DeployDB
  displayName: Deploy Database 
  dependsOn: DeployTerraform
  condition: |
    and
    (
      in(dependencies.DeployTerraform.result, 'Succeeded', 'SucceededWithIssues'),
      eq(variables['deploy'], 'true')
    )
  jobs:  
  - deployment: Database
    pool:
      vmImage: 'windows-latest'
    variables: 
      SQL_GEOSERVER_PASSWORD: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.SQL_GEOSERVER_PASSWORD'] ]
      DATABASE_ID: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.DATABASE_ID'] ]
    # creates an environment if it doesn't exist
    environment: $(Environment)
    strategy:
      # default deployment strategy, more coming...
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: Database 

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: "$(azureSubscription)"
              KeyVaultName: '$(spokeKeyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: true
          
          - task: DownloadPipelineArtifact@2
            inputs:
              source: 'specific'
              project: 'Neptune'
              pipeline: 'NebulaDB Backup Job'
              runVersion: 'latest'
              artifact: bacpac  
              path: '$(Pipeline.Workspace)/bacpac'
            condition: and(succeeded(), eq(variables['restoreDatabase'], true))
          
          - template: azure-pipelines/templates/database/db-deploy-template.yml@BuildTemplates 
            parameters:
              subscription: '$(azureSubscription)'
              serverName: '$(kv-dbServerName).database.windows.net'
              databaseName: '$(databaseName)'
              databaseEdition: '$(databaseEdition)'
              elasticPoolName: '$(kv-elasticPoolName)'
              sqlAdministratorUsername: '$(kv-sqlAdministratorUsername)'
              sqlAdministratorPassword: '$(kv-sqlAdministratorPassword)'
              bacpacFile: '$(Pipeline.Workspace)/bacpac/$(databaseName).bacpac'
              dacpacFile: '$(Pipeline.Workspace)/Database/Nebula.Database.dacpac'
              projectResourceGroupName: '$(resourceGroupName)'
              databaseID: '$(DATABASE_ID)'

          # NOTE: the API's legacy NebulaWeb SQL login is intentionally absent.
          # The API connects as the workload identity
          # (Authentication=Active Directory Default); the db-aad-user step
          # below is what provisions its DB user. The remaining db-user.yml
          # step is GeoServer's, which stays on SQL auth.
          - template: azure-pipelines/templates/database/db-user.yml@BuildTemplates
            parameters:
              subscription: '$(azureSubscription)'
              serverName: '$(kv-dbServerName).database.windows.net'
              databaseName: '$(databaseName)'
              sqlAdministratorUsername: '$(kv-sqlAdministratorUsername)'
              sqlAdministratorPassword: '$(kv-sqlAdministratorPassword)'
              desiredSqlUsername: '$(sqlGeoserverUsername)'
              desiredSqlPassword: '$(SQL_GEOSERVER_PASSWORD)'
              roles: 'db_datareader'

          # Entra-based DB user for the API's managed identity (CREATE USER ...
          # FROM EXTERNAL PROVIDER), granted after every DacPac deploy.
          # PREREQ: the pipeline SP must be (in) the SQL server's Entra admin,
          # or this fails. That is already true for the shared spoke server --
          # wave-runup's equivalent step runs against it today.
          # aadPrincipalName is the EXACT Entra display name, which for a
          # managed identity is its resource name. $(Environment) is already
          # lowercase, matching nebula.tf; never lower() a runtime var at
          # compile time.
          # The legacy SQL login step above is retained during the transition.
          - template: azure-pipelines/templates/database/db-aad-user.yml@BuildTemplates
            parameters:
              subscription: '$(azureSubscription)'
              serverName: '$(kv-dbServerName).database.windows.net'
              databaseName: '$(databaseName)'
              aadPrincipalName: 'nebula-$(Environment)-identity'
              # db_executor (GRANT EXECUTE, defined in
              # Nebula.Database/Security/db_executor.sql) lets the identity run
              # stored procs without db_owner -- no ownership,
              # permission-management or impersonation rights an app identity
              # should not have. Ported from the zybach/Shasta standard.
              roles: 'db_datareader,db_datawriter,db_ddladmin,db_executor'

          # Human access via the H2O Entra groups, granted as contained DB
          # users. Kept in-repo rather than using the shared template because
          # the per-env access matrix is app-specific: QA group writes on qa and
          # reads on prod; Prod group writes everywhere.
          #
          # H2O Readers Group is deliberately absent. Verified against Entra on
          # 2026-08-13: the group has 0 members, so CREATE USER FROM EXTERNAL
          # PROVIDER cannot resolve it and the grant would be a no-op anyway.
          # wave-runup dropped it from its matrix for the same reason (5d2c01d).
          # Its Key Vault role assignment in nebula.tf is retained for parity
          # with wave-runup -- that one is a harmless no-op rather than a
          # failure, since role assignments do not need to resolve members.
          #
          # Gated at RUNTIME on $(Environment) inside the script. Do NOT gate
          # with a compile-time ${{ if eq(variables['Environment'], ...) }}:
          # Environment is a runtime variable (variable group / UI), so it is
          # empty during YAML compilation and the whole block would be silently
          # stripped from the pipeline.
          - task: AzureCLI@2
            displayName: 'Grant DB access to H2O Entra groups'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                # SqlServer module is preinstalled on hosted agents; bootstrap
                # defensively in case an agent lacks it.
                if (-not (Get-Module -ListAvailable -Name SqlServer)) {
                    Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
                    Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
                    Install-Module -Name SqlServer -Scope CurrentUser -Force -AllowClobber
                }
                Import-Module SqlServer

                # An AAD access token is passed to Invoke-Sqlcmd as a parameter
                # rather than through sqlcmd -P: the legacy ODBC sqlcmd on the
                # hosted agent caps -P at 128 chars and a SQL access token is a
                # ~1.5KB JWT.
                $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
                if ([string]::IsNullOrWhiteSpace($token)) { throw 'Failed to acquire an AAD access token for Azure SQL.' }

                $server = '$(kv-dbServerName).database.windows.net'
                $db     = '$(databaseName)'

                # group display name -> comma-separated roles, per environment.
                # A lookup rather than if/else so an unrecognised Environment
                # throws instead of silently falling through to the branch that
                # grants WRITE. Runtime gate, not compile-time.
                $matrix = @{
                    qa = @{
                        'H2O Prod Group' = 'db_datareader,db_datawriter,db_executor'
                        'H2O QA Group'   = 'db_datareader,db_datawriter,db_executor'
                    }
                    prod = @{
                        # H2O QA Group and H2O Readers Group are intentionally ABSENT:
                        # the environment is the boundary and neither has prod access.
                        # Mirrors the access matrix in the root Terraform, which grants
                        # the same groups the same way on the vault, the resource group
                        # and the storage account. Change both together.
                        'H2O Prod Group' = 'db_datareader,db_datawriter,db_executor'
                    }
                }
                if (-not $matrix.ContainsKey('$(Environment)')) { throw "No H2O access matrix defined for Environment '$(Environment)'." }
                $grants = $matrix['$(Environment)']

                foreach ($principal in $grants.Keys) {
                    $roles = $grants[$principal]
                    $sql = @"
                SET ANSI_NULLS ON;
                SET QUOTED_IDENTIFIER ON;
                IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'$principal')
                    CREATE USER [$principal] FROM EXTERNAL PROVIDER;
                "@
                    foreach ($role in $roles.Split(',')) {
                        $r = $role.Trim()
                        if ($r) {
                            # Assert the ROLE exists BEFORE testing membership. IS_ROLEMEMBER returns
                            # NULL for an unknown role, and `NULL = 0` evaluates to UNKNOWN rather than
                            # TRUE, so a bare `= 0` check skips the grant SILENTLY and still reports
                            # success. db_executor is created by this repo's own Database project, so a
                            # DacPac deploy that has not landed yet would leave every db_executor grant
                            # quietly undone behind a green pipeline.
                            #
                            # Checks sys.database_principals with type = 'R' rather than
                            # DATABASE_PRINCIPAL_ID, which resolves ANY principal (users, application
                            # roles). A same-named non-role would satisfy that weaker test and then fail
                            # in ALTER ROLE with a murkier message.
                            $sql += "`nIF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'$r' AND type = 'R') THROW 50000, 'Database role [$r] does not exist -- deploy the DacPac before granting.', 1;"
                            $sql += "`nIF IS_ROLEMEMBER('$r', N'$principal') = 0 ALTER ROLE [$r] ADD MEMBER [$principal];"
                        }
                    }
                    Write-Host "Granting [$principal] roles: $roles on $db"
                    Invoke-Sqlcmd -ServerInstance $server -Database $db -AccessToken $token -Query $sql -ConnectionTimeout 60 -ErrorAction Stop
                }

- stage: DeployGeoServer
  displayName: Deploy GeoServer
  dependsOn: DeployTerraform
  condition: |
    and
    (
      in(dependencies.DeployTerraform.result, 'Succeeded', 'SucceededWithIssues'),
      eq(variables['deploy'], 'true')
    )
  jobs:  
  - deployment: GeoServer
    pool:
      vmImage: 'windows-latest'
    variables: 
      STORAGE_ACCOUNT_SAS_KEY: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.STORAGE_ACCOUNT_SAS_KEY'] ]
    # creates an environment if it doesn't exist
    environment: $(Environment)
    strategy:
      # default deployment strategy, more coming...
      runOnce:
        deploy:
          steps:        
          - download: current
            artifact: GeoServerArtifacts

          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                azcopy copy "$(Pipeline.Workspace)\GeoServerArtifacts\*" "https://$(storageAccountName).file.core.windows.net/geoserver/data_dir/$(STORAGE_ACCOUNT_SAS_KEY)" --from-to=LocalFile --recursive


- stage: DeployHelm
  displayName: Deploy Helm
  dependsOn: 
  - DeployGeoServer
  - DeployDB
  - DeployTerraform
  condition: |
    and
    (
      in(dependencies.DeployGeoServer.result, 'Succeeded', 'SucceededWithIssues'),
      in(dependencies.DeployDB.result, 'Succeeded', 'SucceededWithIssues'),
      in(dependencies.DeployTerraform.result, 'Succeeded', 'SucceededWithIssues'),
      eq(variables['deploy'], 'true')
    )
  jobs:  
  - deployment: Helm
    pool:
      vmImage: 'ubuntu-latest'
    variables: 
      APPLICATION_STORAGE_ACCOUNT_KEY: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.APPLICATION_STORAGE_ACCOUNT_KEY'] ]
      INSTRUMENTATION_KEY: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.INSTRUMENTATION_KEY'] ]
      WORKLOAD_IDENTITY_CLIENT_ID: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.WORKLOAD_IDENTITY_CLIENT_ID'] ]
      WORKLOAD_IDENTITY_TENANT_ID: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.WORKLOAD_IDENTITY_TENANT_ID'] ]
      SQL_GEOSERVER_PASSWORD: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.SQL_GEOSERVER_PASSWORD'] ]
      GEOSERVER_ADMIN_PASSWORD: $[ stageDependencies.DeployTerraform.Terraform.outputs['Terraform.Bash.GEOSERVER_ADMIN_PASSWORD'] ]
    # creates an environment if it doesn't exist
    environment: $(Environment)
    strategy:
      runOnce:
        preDeploy:
          steps:
            - task: AzureKeyVault@2
              inputs:
                azureSubscription: "$(azureSubscription)"
                KeyVaultName: '$(spokeKeyVaultName)'
                SecretsFilter: 'kv-AtlassianClientSecret'
                RunAsPreJob: true

            - template: azure-pipelines/templates/azure-jira-update/update-jira.yml@BuildTemplates 
              parameters: 
                JiraState: "Pending"
                JiraEnvironment: "$(aspNetEnvironment)"
                AtlassianClientSecret: "$(kv-AtlassianClientSecret)"
        on:
          failure:
            steps:
            - task: AzureKeyVault@2
              inputs:
                azureSubscription: "$(azureSubscription)"
                KeyVaultName: '$(spokeKeyVaultName)'
                SecretsFilter: 'kv-AtlassianClientSecret'
                RunAsPreJob: true

            - template: azure-pipelines/templates/azure-jira-update/update-jira.yml@BuildTemplates 
              parameters: 
                JiraState: "Failed"
                JiraEnvironment: "$(aspNetEnvironment)"
                AtlassianClientSecret: "$(kv-AtlassianClientSecret)"
          success: 
            steps:
            - task: AzureKeyVault@2
              inputs:
                azureSubscription: "$(azureSubscription)"
                KeyVaultName: '$(spokeKeyVaultName)'
                SecretsFilter: 'kv-AtlassianClientSecret'
                RunAsPreJob: true

            - template: azure-pipelines/templates/azure-jira-update/update-jira.yml@BuildTemplates 
              parameters: 
                JiraState: "Successful"
                JiraEnvironment: "$(aspNetEnvironment)"
                AtlassianClientSecret: "$(kv-AtlassianClientSecret)"
        deploy:
          steps:
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: "$(azureSubscription)"
              KeyVaultName: '$(spokeKeyVaultName)'
              SecretsFilter: '*'
              RunAsPreJob: true

          - template: azure-pipelines/templates/azure-jira-update/update-jira.yml@BuildTemplates 
            parameters: 
              JiraState: "InProgress"
              JiraEnvironment: "$(aspNetEnvironment)"
              AtlassianClientSecret: "$(kv-AtlassianClientSecret)"
          - download: current
            artifact: ChartArtifacts
                        
          - task: HelmInstaller@0
            displayName: 'Install Helm 3.8.0'
            inputs:
              helmVersion: 3.8.0
              installKubectl: true

          - task: Kubernetes@1
            displayName: 'kubectl login'
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: '$(azureSubscription)'
              azureResourceGroup: '$(kv-azureClusterResourceGroup)'
              kubernetesCluster: '$(kv-kubernetesCluster)'
              command: login

          - task: HelmDeploy@0
            displayName: 'helm dependency update'
            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: '$(azureSubscription)'
              azureResourceGroup: '$(kv-azureClusterResourceGroup)'
              kubernetesCluster: '$(kv-kubernetesCluster)'
              command: 'dependency'
              arguments: 'update $(Pipeline.Workspace)/ChartArtifacts/chart'

          - task: HelmDeploy@0
            displayName: 'helm upgrade nebula'
            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: '$(azureSubscription)'
              azureResourceGroup: '$(kv-azureClusterResourceGroup)'
              kubernetesCluster: '$(kv-kubernetesCluster)'
              namespace: '$(team)'
              arguments: '--create-namespace'
              command: upgrade
              chartType: FilePath
              chartPath: '$(Pipeline.Workspace)/ChartArtifacts/chart'
              releaseName: 'nebula'
              # The API's secret --sets are gone: it reads them from the env Key
              # Vault at startup via workload identity, so Helm carries only the
              # vault name and the (non-secret) identity ids.
              # The GeoServer entries stay -- its JDBC store and Azure File mount
              # have no Entra path, so those secrets still pass through Helm.
              overrideValues: |
                global.domains.api="$(domainApi)"
                global.domains.web="$(domainWeb)"
                global.domains.geoserver="$(domainGeoserver)"
                global.env.name="$(Environment)"
                global.env.keyVaultName="$(keyVaultName)"
                global.workloadIdentity.clientId="$(WORKLOAD_IDENTITY_CLIENT_ID)"
                global.workloadIdentity.tenantId="$(WORKLOAD_IDENTITY_TENANT_ID)"
