{{ if eq .Values.global.env.name "qa" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}-qa-configmap
data:
  # KeyVaultName drives the startup secret load (DefaultAzureCredential via
  # workload identity); SECRET_PATH from the mounted-JSON era is gone.
  KeyVaultName: "{{ .Values.global.env.keyVaultName }}"
  DOCKER_BUILD_SOURCE: "."
  ASPNETCORE_ENVIRONMENT: "Staging"
  SITKA_EMAIL_REDIRECT: "notifications-qa@sitkatech.com"
  WEB_URL: "https://{{ .Values.global.domains.web }}"
  LeadOrganizationEmail: ""
  AUTH0_AUTHORITY: "{{ .Values.global.env.auth0Authority }}"
  AUTH0_AUDIENCE: "{{ .Values.global.env.auth0Audience }}"
{{ end }}
