global:
  env:
    name: "qa"
    # The API reads all of its secrets from this vault at startup via workload
    # identity. Set by the pipeline
    # (--set global.env.keyVaultName=nebula-keyvault-$(Environment)).
    keyVaultName: ""
    # dbServer / databaseName / sqlGeoserverUsername are still required: they
    # feed GeoServer's datastore properties, which stay on SQL auth. The API's
    # sqlUsername is gone -- it now connects with
    # Authentication=Active Directory Default.
    dbServer: "db-server.database.windows.net"
    databaseName: "NebulaDB"
    sqlGeoserverUsername: "NebulaGeo"
    auth0Authority: ""
    auth0Audience: ""
    auth0Domain: ""
    auth0ClientId: ""
  domains:
    api: "internalapi-nebula.aks-qa.sitkatech.com"
    web: "nebula.aks-qa.sitkatech.com"
    geoserver: "geoserver-nebula.aks-qa.sitkatech.com"
  # The user-assigned managed identity the API ServiceAccount federates to.
  # Both values come from nebula.tf outputs via helm --set.
  workloadIdentity:
    clientId: ""
    tenantId: ""
  # GeoServer-only. Unlike wave-runup, nebula cannot drop global.secrets
  # entirely: GeoServer's JDBC store and its Azure File mount cannot use
  # Entra auth, so these four still pass through Helm. The API's
  # apiSqlPassword and sendGridApiKey have moved into Key Vault.
  secrets:
    geoserverSqlServerPassword: "passwordhere"
    geoserverAdminPassword: "geomaster"
    applicationStorageAccountName: "nebulaapplicationgrsqa"
    applicationStorageAccountKey:  "longkeyreplacedhere"

api:
  replicaCount: 1
  image:
    repository: containersesaqa.azurecr.io/nebula/api
    pullPolicy: Always
  nameOverride: ""
  fullnameOverride: ""
  namespace: h2o
  resources: 
    limits:
      memory: "512Mi"
    requests:
      memory: "512Mi"
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "azure-application-gateway"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      acme.cert-manager.io/http01-edit-in-place: "true"
      appgw.ingress.kubernetes.io/ssl-redirect: "true"
      appgw.ingress.kubernetes.io/request-timeout: "300"
      cert-manager.io/issue-temporary-certificate: "true"
      appgw.ingress.kubernetes.io/connection-draining: "true"
      appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector: 
    agentpool: appnodepool
  tolerations: []
  affinity: {}

