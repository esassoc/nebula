# GeoServer datastore connection for the devcontainer. Read via
# ENV_PROPERTIES + ALLOW_ENV_PARAMETRIZATION (see docker-compose.yml), which is
# how the deployed chart supplies the same four values.
#
# These point at the throwaway container SQL Server, so the password here is
# not a secret. Deployed environments get theirs from
# charts/nebula/charts/nebula-geoserver/templates/configmap-environment-properties-template.yaml.
#
# GeoServer stays on SQL auth everywhere: its JDBC store has no Entra path,
# which is why the API went passwordless and GeoServer did not.
datastore-host=nebula.db
datastore-database=NebulaDB
datastore-user=sa
datastore-password=DevPassword#1
